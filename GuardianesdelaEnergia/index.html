<!doctype html>
<html lang="es">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<title>Guardianes de la Energía</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: un celular. Columna de 440px con HUD fijo arriba, barra de navegación abajo y tarjetas de papel sobre el cielo nocturno del cuento. */
:root {
  --space: #090c20;
  --sky: #141a3c;
  --sky-2: #1f2a5c;
  --sky-line: #3a4686;
  --paper: #fff7e6;
  --paper-2: #f3e4c4;
  --ink: #1b1830;
  --muted: #5d5873;
  --sun: #ffc93c;
  --sun-ink: #3a2a00;
  --e: #4fb0ff;
  --p: #ff4f7b;
  --n: #2fbf71;
  --carga: #c9a6ff;
  --ok: #1f9d55;
  --ok-bg: #d9f5e3;
  --no: #d63b4f;
  --no-bg: #fde0e4;
  --on-sky: #eef0ff;
  --on-sky-muted: #b4b9e2;
  --display: "Grandstander", "Trebuchet MS", "Comic Sans MS", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --shadow: 4px 4px 0 rgba(6, 8, 24, .6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.6) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 85% 12%, rgba(255,255,255,.5) 50%, transparent 52%),
    radial-gradient(2px 2px at 70% 60%, rgba(255,236,170,.5) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 20% 80%, rgba(255,255,255,.4) 50%, transparent 52%),
    var(--space);
  background-attachment: fixed;
  color: var(--on-sky);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 41; background: var(--sky); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; text-wrap: balance; margin: 0; }
h1 { font-size: 2.2rem; line-height: 1.02; color: var(--sun); }
h2 { font-size: 1.45rem; line-height: 1.15; }
h3 { font-size: 1.08rem; line-height: 1.2; }
p { margin: 0; }
.eyebrow { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; opacity: .8; }
:focus-visible { outline: 3px solid var(--e); outline-offset: 3px; }

/* El "celular" */
.phone { max-width: 440px; margin: 0 auto; min-height: 100vh; background: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 100%); box-shadow: 0 0 0 2px var(--sky-line), 0 30px 80px rgba(0, 0, 0, .6); }
@media (max-width: 460px) { .phone { box-shadow: none; } }
#app {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(92px + env(safe-area-inset-bottom, 0px));
}

/* HUD global */
.hud-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--sky); border-bottom: 2px solid var(--sky-line); display: grid; gap: 6px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.hud-wrap[hidden] { display: none; }
.hud-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { display: flex; align-items: center; gap: 6px; background: var(--sky-2); border: 2px solid var(--sky-line); border-radius: 999px; padding: 3px 10px 3px 5px; min-width: 0; }
.stat svg { width: 20px; height: 20px; flex: none; }
.stat b { font-variant-numeric: tabular-nums; font-size: .85rem; min-width: 2.2ch; text-align: right; }
.barra { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--ink); overflow: hidden; }
.barra::-webkit-progress-bar { background: var(--ink); border-radius: 999px; }
.barra::-webkit-progress-value { background: var(--vida, var(--n)); border-radius: 999px; transition: width .3s; }
.barra::-moz-progress-bar { background: var(--vida, var(--n)); border-radius: 999px; }
.hud-coins { display: flex; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--sky-2); color: var(--on-sky); border: 2px solid var(--sky-line); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: .88rem; white-space: nowrap; }
.chip svg { width: 18px; height: 18px; flex: none; }
.chip.low { background: var(--no); border-color: var(--no); color: #fff; }
button.chip { cursor: pointer; font-family: var(--body); }
.hud-coins #sound { margin-left: auto; padding: 3px 8px; }
.flota { position: fixed; z-index: 60; font: 800 1.15rem var(--display); color: var(--sun); pointer-events: none; text-shadow: 0 2px 0 var(--ink); animation: subir .95s ease-out forwards; }
.flota.carga { color: var(--carga); }
.flota.menos { color: var(--p); }
@keyframes subir { to { transform: translateY(-38px); opacity: 0; } }

/* Barra de navegación inferior */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(440px, 100%); z-index: 40; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sky); border-top: 2px solid var(--sky-line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar[hidden] { display: none; }
.tabbar button { background: none; border: 0; color: var(--on-sky-muted); display: grid; justify-items: center; gap: 2px; padding: 8px 0 10px; font: 800 .8rem var(--display); cursor: pointer; }
.tabbar svg { width: 26px; height: 26px; }
.tabbar button[aria-current="page"] { color: var(--sun); }

/* Botones */
.btn { font: 800 1.02rem var(--display); background: var(--sun); color: var(--sun-ink); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 16px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; transition: transform .08s, box-shadow .08s; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.alt { background: #fff; color: var(--ink); }
.btn.small { font-size: .92rem; padding: 6px 12px; }
.btn.big { font-size: 1.15rem; padding: 12px 18px; }
.btn.full { width: 100%; }
.btn small { display: block; font: 700 .76rem var(--body); opacity: .75; margin-top: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; align-items: flex-end; }
.stack { display: grid; gap: 14px; }
.center { text-align: center; justify-items: center; }

/* Tarjetas */
.panel { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; }
.panel .muted { color: var(--muted); }
.nota { color: var(--on-sky-muted); font-size: .9rem; }
.gana { display: inline-block; font-weight: 700; color: var(--ok); white-space: nowrap; }
.gana.c { color: #7a4fc9; }

/* Personajes que hablan */
.say { display: flex; gap: 8px; align-items: flex-end; }
.say .av { flex: none; width: 54px; height: 60px; }
.say .av svg { width: 100%; height: 100%; overflow: visible; }
.say .trio { flex: none; display: flex; }
.say .trio .av { width: 36px; height: 40px; margin-left: -8px; }
.say .trio .av:first-child { margin-left: 0; }
.bubble { flex: 1; min-width: 0; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px 16px 16px 4px; padding: 8px 14px 10px; box-shadow: var(--shadow); }
.who { display: inline-block; background: var(--who, var(--sun)); color: var(--ink); font: 800 .8rem var(--display); padding: 0 9px; border-radius: 999px; border: 2px solid var(--ink); margin-bottom: 4px; }
.pen { display: inline-block; font-weight: 700; color: var(--no); white-space: nowrap; }

/* Elección de mascota */
.lede { color: var(--on-sky); }
.opciones-mascota { display: grid; gap: 12px; }
.mascota-op { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 14px; cursor: pointer; box-shadow: var(--shadow); font: inherit; }
.mascota-op[aria-checked="true"] { background: #fff1bf; outline: 4px solid var(--sun); outline-offset: 2px; }
.mascota-pic { width: 76px; flex: none; }
.mascota-pic svg { width: 100%; height: auto; overflow: visible; display: block; }
.mascota-op b { font: 800 1.3rem var(--display); display: block; }
.mascota-op small { font-size: .92rem; color: var(--muted); }

/* Habitación */
.room { position: relative; aspect-ratio: 4 / 5; max-width: 100%; border: 3px solid var(--ink); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: #2a2346; }
.room > svg.cuarto { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pet { position: absolute; left: 50%; bottom: 6%; width: 46%; transform: translateX(-50%); }
.pet > svg { width: 100%; height: auto; display: block; overflow: visible; transform-origin: 50% 100%; animation: flotar 2.4s ease-in-out infinite; }
.pet::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -2px; height: 9%; border-radius: 50%; background: rgba(0, 0, 0, .28); z-index: -1; }
.pet.preocupada > svg { animation: temblar .45s ease-in-out infinite; }
.pet.debil > svg { filter: grayscale(.75) brightness(.85); animation-duration: 4s; }
@keyframes flotar { 50% { transform: translateY(-6%) scaleY(1.03); } }
@keyframes temblar { 25% { transform: translateX(-3px) rotate(-3deg); } 75% { transform: translateX(3px) rotate(3deg); } }
#zona-amenazas { position: absolute; inset: 0; pointer-events: none; }
.amenaza { position: absolute; transform: translate(-50%, -50%); width: clamp(56px, 19%, 86px); aspect-ratio: 1; pointer-events: auto; background: rgba(255, 255, 255, .18); border: 3px solid var(--no); border-radius: 50%; padding: 5px; cursor: pointer; animation: aparecer .4s ease-out both, latido 1.2s ease-in-out .4s infinite; }
.amenaza > svg { width: 100%; height: 100%; display: block; }
.amenaza .costo { position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 3px; background: var(--sun); color: var(--sun-ink); border: 2px solid var(--ink); border-radius: 999px; font: 800 .78rem var(--display); padding: 0 7px 0 4px; white-space: nowrap; }
.amenaza .costo svg { width: 13px; height: 13px; }
@keyframes aparecer { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
@keyframes latido { 50% { box-shadow: 0 0 0 9px rgba(214, 59, 79, .35); } }
.room.peligro::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 60px rgba(214, 59, 79, .6); animation: alarma 1.2s ease-in-out infinite; }
@keyframes alarma { 50% { opacity: .35; } }
.mood { font-family: var(--display); }
.acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acciones .full { grid-column: 1 / -1; }

/* Tienda */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--sky-2); border: 2px solid var(--sky-line); border-radius: 14px; padding: 4px; }
.tabs button { border: 0; border-radius: 10px; background: none; color: var(--on-sky-muted); font: 800 .98rem var(--display); padding: 8px 0; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--sun); color: var(--sun-ink); }
.vitrina { display: flex; align-items: center; gap: 14px; }
.vitrina .pv { width: 96px; flex: none; }
.vitrina .pv svg { width: 100%; height: auto; overflow: visible; display: block; }
.items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.item { display: grid; gap: 6px; padding: 10px; border-radius: 16px; align-content: start; position: relative; }
.item .pv { aspect-ratio: 1; background: var(--paper-2); border-radius: 12px; display: grid; place-items: center; padding: 10px; }
.item .pv svg { width: 100%; height: 100%; overflow: visible; }
.item h3 { font-size: .98rem; }
.item .desc { font-size: .8rem; color: var(--muted); line-height: 1.3; }
.item .precio { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: .86rem; color: var(--muted); }
.item .precio svg { width: 16px; height: 16px; }
.item .btn { width: 100%; font-size: .9rem; padding: 7px 8px; }
.item .sello { position: absolute; top: 6px; right: 6px; background: var(--n); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; font: 800 .72rem var(--display); padding: 0 8px; }

/* Menú de niveles */
.hero { display: grid; gap: 12px; }
.hero-art svg { display: block; width: 100%; max-width: 230px; height: auto; margin-inline: auto; }
.chapters { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ch { display: flex; gap: 12px; align-items: flex-start; }
.ch-num { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font: 800 1.4rem var(--display); color: var(--ink); background: var(--c, var(--sun)); }
.ch-body { display: grid; gap: 6px; min-width: 0; flex: 1; }
.ch.locked { opacity: .62; }
.ch-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stars { display: inline-flex; gap: 2px; flex-wrap: wrap; }
.stars svg { width: 20px; height: 20px; }
.stars.big svg { width: 40px; height: 40px; }
.lines { display: grid; gap: 10px; }
.lines dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.lines dl div { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; }
.lines dl div.wide { grid-column: 1 / -1; }
.lines dt { font-size: .8rem; color: var(--muted); font-weight: 700; }
.lines dd { margin: 0; font: 800 1.35rem var(--display); font-variant-numeric: tabular-nums; }
.foot { color: var(--on-sky-muted); font-size: .86rem; display: grid; gap: 10px; }
.linklike { background: none; border: 0; padding: 0; color: var(--on-sky); text-decoration: underline; cursor: pointer; font: inherit; justify-self: start; text-align: left; }

/* Escenas */
.hud { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.hud-stats { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.scene-wrap { border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); background: var(--ink); line-height: 0; }
.scene { display: block; width: 100%; height: auto; max-width: 100%; }
.spot { cursor: pointer; outline: none; }
.spot:focus-visible { filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 2px #fff); }
.spot.found { cursor: default; }
.ring { fill: rgba(255, 201, 60, .14); stroke: var(--sun); stroke-width: 6; transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out both; }
.hint-ring { fill: none; stroke: #fff; stroke-width: 5; stroke-dasharray: 10 8; transform-box: fill-box; transform-origin: center; animation: pulse 1s ease-in-out infinite; }
.spark { animation: flick .5s steps(2) infinite; }
.shake { animation: shake .35s; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes pulse { 50% { transform: scale(1.12); opacity: .55; } }
@keyframes flick { 50% { opacity: .2; } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.guide { margin-top: 14px; display: grid; gap: 12px; }
.result { display: grid; gap: 10px; justify-items: start; }

/* Preguntas */
.quiz { display: grid; gap: 14px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; font: 700 1rem var(--body); background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 11px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { background: var(--paper-2); }
.opt:disabled { cursor: default; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.no { background: var(--no-bg); border-color: var(--no); text-decoration: line-through; opacity: .85; }
.fb { display: grid; gap: 12px; justify-items: start; }
.fb .say { width: 100%; }
.progress-dots { display: flex; gap: 6px; }
.progress-dots i { width: 24px; height: 6px; border-radius: 3px; background: var(--paper-2); border: 1px solid var(--ink); }
.progress-dots i.on { background: var(--sun); }

/* Emergencia */
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: paso; }
.plan li { counter-increment: paso; display: flex; gap: 10px; align-items: center; min-height: 48px; padding: 8px 12px; border: 2px dashed var(--muted); border-radius: 12px; color: var(--muted); font-size: .95rem; }
.plan li::before { content: counter(paso); flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 .95rem var(--display); background: var(--paper-2); color: var(--ink); border: 2px solid var(--ink); }
.plan li.done { border: 2px solid var(--ok); background: var(--ok-bg); color: var(--ink); }
.plan li.done::before { background: var(--n); }
.steps { display: grid; gap: 8px; }
.steps .opt { font-size: .95rem; padding: 10px 12px; }
.dial { width: 100%; max-width: 300px; display: grid; gap: 10px; justify-self: center; }
.display { font: 800 2rem var(--display); font-variant-numeric: tabular-nums; background: var(--ink); color: var(--sun); border-radius: 14px; padding: 8px; text-align: center; min-height: 60px; letter-spacing: .12em; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { font: 800 1.45rem var(--display); padding: 10px 0; border: 3px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; }
.key:active { background: var(--paper-2); }
.dial .row .btn { flex: 1; }

/* Pacto */
.hand { display: flex; justify-content: center; align-items: flex-end; gap: 8px; height: 200px; padding-top: 10px; }
.finger { width: 17%; max-width: 66px; border: 3px solid var(--ink); border-radius: 40px 40px 14px 14px; background: var(--paper-2); color: var(--ink); font: 800 1.5rem var(--display); cursor: pointer; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; box-shadow: 3px 3px 0 var(--ink); transition: background .2s, transform .15s; }
.finger:hover { transform: translateY(-4px); }
.finger.on { background: var(--c); }
.palm { height: 24px; max-width: 360px; margin: -3px auto 0; background: var(--paper-2); border: 3px solid var(--ink); border-radius: 0 0 40px 40px; }
.consejos { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.consejos li { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; }
.consejos .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 .95rem var(--display); background: var(--c); color: var(--ink); border: 2px solid var(--ink); }
.consejos li.off { color: var(--muted); }
.consejos li.off .n { background: var(--paper-2); }
.cert { border: 3px dashed var(--ink); border-radius: 18px; padding: 18px; text-align: center; display: grid; gap: 10px; justify-items: center; background: #fffdf6; }
.cert .name { font: 800 1.8rem var(--display); color: var(--ink); border-bottom: 3px solid var(--ink); min-width: min(280px, 100%); padding: 0 8px 4px; overflow-wrap: anywhere; }
.cert .pv { width: 90px; }
.cert .pv svg { width: 100%; height: auto; overflow: visible; }
label { font-weight: 700; display: grid; gap: 6px; }
input[type="text"] { font: inherit; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); width: 100%; }

/* Modal */
.modal-fondo { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 28, .72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { max-width: 400px; width: 100%; display: grid; gap: 12px; }
.modal .bubble { box-shadow: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const NS = "http://www.w3.org/2000/svg";
  const screen = $("#screen");

  // ---------- Datos (JSON) ----------
  const DATOS = JSON.parse($("#datos-juego").textContent);
  const EVENTOS = Object.fromEntries(DATOS.eventosMascota.map(e => [e.idEvento, e]));

  // Ritmo de la habitación de la mascota
  const INTERVALO_MIN = 30;           // segundos mínimos entre amenazas
  const INTERVALO_MAX = 60;           // segundos máximos entre amenazas
  const MAX_AMENAZAS = 3;             // amenazas al mismo tiempo
  const COSTO_RECARGA = 10;           // cápsulas para recargar salud
  const SALUD_RECARGA = 20;           // salud que da una recarga
  // Felicidad
  const FELICIDAD_POR_SEGUNDO = 1 / 30;   // baja 1 punto cada 30 segundos, siempre
  const FELICIDAD_POR_AMENAZA = 0.15;     // extra por segundo por cada problema sin resolver
  const FELICIDAD_AUSENTE_MAX = 30;       // lo máximo que baja mientras el juego está cerrado
  // Cargas
  const CARGAS_POR_PROBLEMA = 1;          // al solucionar un problema del cuarto
  const CARGAS_PACTO = 2;                 // al firmar el pacto por primera vez
  // Las cargas por nivel son 1 + las estrellas ganadas (2 a 4).

  // ---------- Almacenamiento ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("gde:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("gde:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  let progress = store.get("progress", {});
  const saveProgress = () => store.set("progress", progress);
  const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const leerJSON = (k, d) => { try { const v = leer(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const numero = (v, d) => (v !== null && !isNaN(+v) ? +v : d);

  // ---------- Estado global de la mascota ----------
  let saludMascota = Math.min(100, Math.max(0, numero(leer("saludMascota"), 100)));
  let recursosEnergia = Math.max(0, Math.floor(numero(leer("recursosEnergia"), 0)));
  let amenazasActivas = leerJSON("amenazasActivas", []).filter(id => EVENTOS[id]);
  let felicidadMascota = Math.min(100, Math.max(0, numero(leer("felicidadMascota"), 100)));
  let cargasEnergia = Math.max(0, Math.floor(numero(leer("cargasEnergia"), 0)));
  let mascotaElegida = ["electron", "proton", "neutron"].includes(leer("mascotaElegida")) ? leer("mascotaElegida") : null;
  let inventario = Object.assign({ ropa: [], cuarto: [] }, leerJSON("inventario", {}));
  let equipado = Object.assign({ cabeza: null, cara: null, cuello: null }, leerJSON("equipado", {}));
  let decoracion = leerJSON("decoracion", []);

  // La felicidad también baja, poco, mientras el juego está cerrado.
  const ultimaVisita = numero(leer("ultimaVisita"), 0);
  if (ultimaVisita && mascotaElegida) {
    const ausente = Math.max(0, (Date.now() - ultimaVisita) / 1000);
    felicidadMascota = Math.max(0, felicidadMascota - Math.min(FELICIDAD_AUSENTE_MAX, ausente * FELICIDAD_POR_SEGUNDO));
  }

  function guardarEstadoMascota() {
    try {
      localStorage.setItem("saludMascota", String(saludMascota));
      localStorage.setItem("recursosEnergia", String(recursosEnergia));
      localStorage.setItem("amenazasActivas", JSON.stringify(amenazasActivas));
      localStorage.setItem("felicidadMascota", String(felicidadMascota));
      localStorage.setItem("cargasEnergia", String(cargasEnergia));
      if (mascotaElegida) localStorage.setItem("mascotaElegida", mascotaElegida);
      else localStorage.removeItem("mascotaElegida");
      localStorage.setItem("inventario", JSON.stringify(inventario));
      localStorage.setItem("equipado", JSON.stringify(equipado));
      localStorage.setItem("decoracion", JSON.stringify(decoracion));
      localStorage.setItem("ultimaVisita", String(Date.now()));
    } catch (e) {}
  }

  // ---------- HUD global ----------
  const barraSalud = $("#barra-salud");
  const barraFelicidad = $("#barra-felicidad");
  const contadorRecursos = $("#contador-recursos");
  const contadorCargas = $("#contador-cargas");
  const colorNivel = v => (v > 60 ? "var(--n)" : v > 30 ? "var(--sun)" : "var(--no)");
  const animoDe = f => (f > 60 ? "alto" : f > 30 ? "medio" : "bajo");
  const ANIMO_TEXTO = { alto: "Feliz", medio: "Más o menos", bajo: "Triste" };

  function pintarHUD() {
    barraSalud.value = saludMascota;
    barraSalud.style.setProperty("--vida", colorNivel(saludMascota));
    $("#salud-num").textContent = Math.ceil(saludMascota);
    barraFelicidad.value = felicidadMascota;
    barraFelicidad.style.setProperty("--vida", colorNivel(felicidadMascota));
    $("#felicidad-num").textContent = Math.ceil(felicidadMascota);
    $("#icono-felicidad use").setAttribute("href", "#s-cara-" + animoDe(felicidadMascota));
    contadorRecursos.textContent = recursosEnergia;
    contadorCargas.textContent = cargasEnergia;
    const total = ["casa", "barrio", "emergencia"].reduce((s, k) => s + (progress[k] || 0), 0);
    $("#totalStars").innerHTML = `<svg aria-hidden="true"><use href="#s-star" fill="#ffc93c"/></svg>${total}/9`;
  }
  function flotar(texto, el, clase = "") {
    const r = el.getBoundingClientRect();
    const s = document.createElement("span");
    s.className = "flota " + clase;
    s.textContent = texto;
    s.style.left = r.left + "px";
    s.style.top = (r.top - 6) + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
  // Cápsulas ganadas en un nivel
  function actualizarRecursos(ganado) {
    contadorRecursos.textContent = recursosEnergia;
    guardarEstadoMascota();
    if (ganado) flotar("+" + ganado, contadorRecursos);
  }
  // Cargas ganadas (niveles y problemas resueltos)
  function ganarCargas(n) {
    if (!n) return;
    cargasEnergia += n;
    contadorCargas.textContent = cargasEnergia;
    guardarEstadoMascota();
    flotar("+" + n, contadorCargas, "carga");
  }

  // ---------- Sonido ----------
  let soundOn = store.get("sound", true);
  let actx = null;
  function tone(freqs, dur = 0.12, type = "sine") {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      freqs.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + i * dur);
        g.gain.exponentialRampToValueAtTime(0.14, t + i * dur + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * dur + dur);
        o.connect(g).connect(actx.destination);
        o.start(t + i * dur); o.stop(t + i * dur + dur + 0.03);
      });
    } catch (e) {}
  }
  const sfx = {
    good: () => tone([660, 880]),
    bad: () => tone([240, 180], 0.14, "square"),
    win: () => tone([523, 659, 784, 1046], 0.14),
    alarma: () => tone([880, 620, 880, 620], 0.11, "triangle"),
    compra: () => tone([784, 988, 1318], 0.1)
  };
  const soundBtn = $("#sound");
  const paintSound = () => {
    soundBtn.querySelector("use").setAttribute("href", soundOn ? "#i-sonido" : "#i-mudo");
    soundBtn.setAttribute("aria-pressed", String(soundOn));
  };
  soundBtn.onclick = () => { soundOn = !soundOn; store.set("sound", soundOn); paintSound(); };
  paintSound();

  // ---------- Personajes ----------
  const SABIOS = {
    electron: { name: "Electrón", color: "var(--e)" },
    proton: { name: "Protón", color: "var(--p)" },
    neutron: { name: "Neutrón", color: "var(--n)" },
    all: { name: "Los tres sabios", color: "var(--sun)" }
  };
  const av = who => `<svg class="av" viewBox="0 0 100 110" aria-hidden="true"><use href="#s-${who}" width="100" height="110"/></svg>`;
  function say(who, html, avatar) {
    const s = SABIOS[who];
    const pic = avatar || (who === "all" ? `<span class="trio">${av("neutron")}${av("proton")}${av("electron")}</span>` : av(who));
    return `<div class="say">${pic}<div class="bubble"><span class="who" style="--who:${s.color}">${s.name}</span><p>${html}</p></div></div>`;
  }

  // Cara y ropa de la mascota. La boca cambia según la felicidad.
  const CARA = {
    electron: { boca: [50, 65], ojos: [42, 58, 54], tinta: "#10213a" },
    proton: { boca: [50, 65], ojos: [41, 59, 54], tinta: "#3a0716" },
    neutron: { boca: [51, 59], ojos: [43, 59, 48], tinta: "#0f3a22" }
  };
  const AJUSTE = {
    electron: { cabeza: -1, cara: 0, cuello: -2 },
    proton: { cabeza: 3, cara: 0, cuello: 3 },
    neutron: { cabeza: 0, cara: -6, cuello: -9 }
  };
  const ROPA = Object.fromEntries(DATOS.tienda.ropa.map(r => [r.id, r]));
  function petMarkup(who, { mood = animoDe(felicidadMascota), ropa = equipado } = {}) {
    const c = CARA[who];
    const [mx, my] = c.boca;
    const [ol, or, oy] = c.ojos;
    let cara;
    if (mood === "alto") {
      cara = `<path d="M${mx - 10} ${my}q10 11 20 0z" fill="${c.tinta}"/>`;
    } else if (mood === "medio") {
      cara = `<path d="M${mx - 7} ${my + 4}h14" stroke="${c.tinta}" stroke-width="3.2" stroke-linecap="round"/>`;
    } else {
      cara = `<path d="M${mx - 8} ${my + 8}q8-9 16 0" fill="none" stroke="${c.tinta}" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M${ol - 6} ${oy - 8}l9 -4M${or + 6} ${oy - 8}l-9 -4" stroke="${c.tinta}" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse cx="${or + 6}" cy="${oy + 9}" rx="2.6" ry="4" fill="#8fd3ff" stroke="#2b8acb" stroke-width="1"/>`;
    }
    const capas = ["cuello", "cara", "cabeza"].map(slot => {
      const id = ropa[slot];
      return id && ROPA[id] ? `<use href="#r-${id}" width="100" height="110" transform="translate(0 ${AJUSTE[who][slot]})"/>` : "";
    }).join("");
    return `<svg viewBox="0 0 100 110" overflow="visible" aria-hidden="true"><use href="#s-${who}-cuerpo" width="100" height="110"/>${cara}${capas}</svg>`;
  }
  const sayPet = html => say(mascotaElegida, html, `<span class="av">${petMarkup(mascotaElegida)}</span>`);

  function stars(n, max = 3, big = false) {
    let out = "";
    for (let i = 0; i < max; i++) out += `<svg aria-hidden="true"><use href="#s-star" fill="${i < n ? "#ffc93c" : "transparent"}"/></svg>`;
    return `<span class="stars${big ? " big" : ""}" role="img" aria-label="${n} de ${max} estrellas">${out}</span>`;
  }
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const azar = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const escapeHtml = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const capsulasTxt = n => `<span class="gana">+${n} cápsulas</span>`;
  const cargasTxt = n => `<span class="gana c">+${n} ${n === 1 ? "carga" : "cargas"}</span>`;

  const CHAPTERS = [
    { id: "casa", title: "La casa de Emma", sub: "Encuentra los riesgos eléctricos de la sala y el baño.", who: "electron" },
    { id: "barrio", title: "El barrio en fiesta", sub: "Es 7 de agosto. Revisa la calle antes de salir a celebrar.", who: "proton" },
    { id: "emergencia", title: "¡Emergencia!", sub: "Ordena los pasos de ayuda y marca el número correcto.", who: "neutron" },
    { id: "pacto", title: "El pacto de los cinco dedos", sub: "Repasa los cinco consejos y firma tu pacto de guardián.", who: "all" }
  ];

  // ---------- Temporizadores y navegación ----------
  const timers = new Set();
  const repetir = (fn, ms) => { const id = setInterval(fn, ms); timers.add(id); return id; };
  const detener = id => { clearInterval(id); timers.delete(id); };
  let dañoTimer = null;
  let alRefrescar = null; // la pantalla de la mascota se registra aquí para ver la felicidad en vivo
  function limpiarTimers() { timers.forEach(clearInterval); timers.clear(); dañoTimer = null; alRefrescar = null; }

  const hud = $("#hud");
  const tabbar = $("#tabbar");
  function go(fn, arg) {
    limpiarTimers();
    cerrarModal();
    hud.hidden = !fn.tab;
    tabbar.hidden = !fn.tab;
    $$("[data-nav]", tabbar).forEach(b => {
      if (b.dataset.nav === fn.tab) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    fn(arg);
    pintarHUD();
    window.scrollTo(0, 0);
    screen.focus({ preventScroll: true });
  }
  $$("[data-nav]", tabbar).forEach(b => b.onclick = () => {
    const destino = { cuarto: pantallaMascota, niveles, tienda }[b.dataset.nav];
    go(destino);
  });
  const isUnlocked = i => i === 0 || progress[CHAPTERS[i - 1].id] != null;

  // ---------- Modal ----------
  function mostrarModal({ titulo, html, quien, avatar, botones }) {
    cerrarModal();
    const fondo = document.createElement("div");
    fondo.className = "modal-fondo";
    fondo.id = "modal";
    fondo.innerHTML = `
      <div class="panel modal" role="dialog" aria-modal="true" aria-labelledby="modal-t">
        <h2 id="modal-t">${titulo}</h2>
        ${quien ? say(quien, html, avatar) : `<p>${html}</p>`}
        <div class="row">${botones.map((b, i) => `<button class="btn${b.alt ? " alt" : ""}" data-i="${i}" type="button">${b.texto}</button>`).join("")}</div>
      </div>`;
    document.body.appendChild(fondo);
    $$("[data-i]", fondo).forEach(b => b.onclick = () => {
      const accion = botones[b.dataset.i].accion;
      cerrarModal();
      if (accion) accion();
    });
    $("[data-i]", fondo).focus();
  }
  function cerrarModal() { const m = $("#modal"); if (m) m.remove(); }

  // ---------- Felicidad: baja siempre, un poco más con problemas sin resolver ----------
  setInterval(() => {
    if (!mascotaElegida) return;
    const antes = animoDe(felicidadMascota);
    felicidadMascota = Math.max(0, felicidadMascota - FELICIDAD_POR_SEGUNDO - FELICIDAD_POR_AMENAZA * amenazasActivas.length);
    pintarHUD();
    guardarEstadoMascota();
    if (alRefrescar) alRefrescar(antes !== animoDe(felicidadMascota));
  }, 1000);

  // ---------- Elegir mascota (solo la primera vez) ----------
  const PERSONALIDAD = {
    electron: "Siempre conectado con la acción. No se queda quieto.",
    proton: "Siempre conectado con la felicidad. Contagia alegría.",
    neutron: "Siempre conectado con la prudencia. Observa antes de actuar."
  };
  function pantallaEleccion() {
    let elegida = null;
    screen.innerHTML = `
      <section class="stack">
        <div class="stack center">
          <p class="eyebrow">Guardianes de la Energía</p>
          <h1>Elige a tu compañero</h1>
          <p class="lede">Vivirá en tu cuarto y te acompañará en todo el juego. Elige bien: <b>no podrás cambiarlo después</b>.</p>
        </div>
        <div class="opciones-mascota" role="radiogroup" aria-label="Mascotas">
          ${["electron", "proton", "neutron"].map(k => `
            <button class="mascota-op" role="radio" aria-checked="false" data-m="${k}" type="button">
              <span class="mascota-pic">${petMarkup(k, { mood: "alto", ropa: {} })}</span>
              <span><b>${SABIOS[k].name}</b><small>${PERSONALIDAD[k]}</small></span>
            </button>`).join("")}
        </div>
        <button class="btn big full" id="confirmar" type="button" disabled>Toca una mascota</button>
      </section>`;
    const confirmar = $("#confirmar");
    $$("[data-m]").forEach(b => b.onclick = () => {
      elegida = b.dataset.m;
      $$("[data-m]").forEach(x => x.setAttribute("aria-checked", String(x === b)));
      confirmar.disabled = false;
      confirmar.textContent = `Quedarme con ${SABIOS[elegida].name}`;
      sfx.good();
    });
    confirmar.onclick = () => {
      if (!elegida) return;
      const nombre = SABIOS[elegida].name;
      mostrarModal({
        titulo: `¿${nombre} para siempre?`,
        quien: elegida,
        avatar: `<span class="av">${petMarkup(elegida, { mood: "alto", ropa: {} })}</span>`,
        html: `Seré tu compañero en todo el juego. Después no podrás cambiar de mascota.`,
        botones: [
          { texto: "Sí, es mi mascota", accion: () => {
            mascotaElegida = elegida;
            saludMascota = 100; felicidadMascota = 100; amenazasActivas = [];
            guardarEstadoMascota();
            sfx.win();
            go(pantallaMascota);
          } },
          { texto: "Pensarlo otra vez", alt: true }
        ]
      });
    };
  }

  // ---------- Pantalla principal: el cuarto ----------
  function aplicarDecoracion(svgRoot) {
    $$("[data-decor]", svgRoot).forEach(g => g.toggleAttribute("hidden", !decoracion.includes(g.dataset.decor)));
  }
  function pantallaMascota() {
    const nombre = SABIOS[mascotaElegida].name;
    screen.innerHTML = `
      <section id="pantalla-mascota" class="stack">
        <div class="row between">
          <div><p class="eyebrow">Tu cuarto</p><h2>${nombre}</h2></div>
          <span class="chip mood" id="moodChip"></span>
        </div>
        <div class="room" id="room">
          <div class="pet" id="pet" aria-hidden="true"></div>
          <div id="zona-amenazas"></div>
        </div>
        <div id="petSay" aria-live="polite"></div>
        <div class="acciones">
          <button class="btn alt" id="recargar" type="button">Recargar salud<small>${COSTO_RECARGA} cápsulas · +${SALUD_RECARGA}</small></button>
          <button class="btn alt" id="mimar" type="button">Consentir<small>Mimos con cargas</small></button>
          <button class="btn big full" id="btn-ir-niveles" type="button">Ir a los niveles a ganar cápsulas</button>
        </div>
        <p class="nota">Cada ${INTERVALO_MIN} a ${INTERVALO_MAX} segundos aparece un riesgo eléctrico. Mientras siga ahí, ${nombre} pierde salud y felicidad. Tócalo y págalo con cápsulas: además ganas ${CARGAS_POR_PROBLEMA} carga para la tienda.</p>
      </section>`;

    const room = $("#room");
    room.insertBefore($("#tpl-cuarto").content.cloneNode(true), room.firstChild);
    aplicarDecoracion(room);
    const zona = $("#zona-amenazas");
    const pet = $("#pet");
    const decir = html => { $("#petSay").innerHTML = sayPet(html); };
    const pintarMascota = () => { pet.innerHTML = petMarkup(mascotaElegida); };

    function animo() {
      const a = animoDe(felicidadMascota);
      pet.classList.toggle("preocupada", amenazasActivas.length > 0);
      pet.classList.toggle("debil", saludMascota < 30);
      room.classList.toggle("peligro", amenazasActivas.length > 0);
      $("#moodChip").innerHTML = `<svg aria-hidden="true"><use href="#s-cara-${a}"/></svg>${ANIMO_TEXTO[a]}`;
    }
    alRefrescar = cambioDeAnimo => {
      if (cambioDeAnimo) { pintarMascota(); if (animoDe(felicidadMascota) === "bajo") decir(`Me siento triste... ¿me consientes? En la tienda hay mimos que se pagan con cargas.`); }
      animo();
    };

    function mensajeBase() {
      if (amenazasActivas.length) {
        const barato = Math.min(...amenazasActivas.map(id => EVENTOS[id].costoSolucion));
        return `¡Ayuda! Hay ${amenazasActivas.length === 1 ? "un riesgo" : amenazasActivas.length + " riesgos"} en el cuarto. Toca el que brilla para solucionarlo.` +
          (recursosEnergia < barato ? " No tenemos suficientes cápsulas: ve a los niveles a ganar más." : "");
      }
      if (felicidadMascota <= 30) return "Me siento triste... ¿me consientes? En la tienda hay mimos que se pagan con cargas.";
      if (saludMascota < 40) return `Me siento sin fuerzas. Puedes recargarme con ${COSTO_RECARGA} cápsulas.`;
      if (recursosEnergia === 0 && progress.casa == null) return `¡Hola! Soy ${nombre} y este es nuestro cuarto. Ayúdame a cuidarlo de los riesgos eléctricos. Para solucionarlos necesitas cápsulas, y las ganas en los niveles.`;
      return felicidadMascota > 60 ? "¡Todo está seguro! Gracias por cuidarme." : "Todo está seguro por ahora, pero me vendría bien un mimo.";
    }

    function pintarAmenazas() {
      zona.innerHTML = amenazasActivas.map(id => {
        const e = EVENTOS[id];
        return `<button class="amenaza" type="button" data-ev="${id}" style="left:${e.posicion.x}%;top:${e.posicion.y}%" aria-label="${e.nombre}. Solucionarlo cuesta ${e.costoSolucion} cápsulas.">
          <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#g-${e.grafico}"/></svg>
          <span class="costo"><svg aria-hidden="true"><use href="#s-capsula"/></svg>${e.costoSolucion}</span>
        </button>`;
      }).join("");
      animo();
    }

    // Daño: mientras haya amenazas activas, la salud baja cada segundo.
    function iniciarDaño() {
      if (dañoTimer || !amenazasActivas.length || saludMascota <= 0) return;
      dañoTimer = repetir(() => {
        const daño = amenazasActivas.reduce((s, id) => s + EVENTOS[id].dañoPorSegundo, 0);
        saludMascota = Math.max(0, saludMascota - daño);
        pintarHUD();
        guardarEstadoMascota();
        animo();
        if (saludMascota <= 0) { detenerDaño(); estacionRecarga(); }
      }, 1000);
    }
    function detenerDaño() { if (dañoTimer) { detener(dañoTimer); dañoTimer = null; } }

    function aparecerAmenaza() {
      if (amenazasActivas.length >= MAX_AMENAZAS) return;
      const libres = DATOS.eventosMascota.filter(e => !amenazasActivas.includes(e.idEvento));
      if (!libres.length) return;
      const e = libres[Math.floor(Math.random() * libres.length)];
      amenazasActivas.push(e.idEvento);
      guardarEstadoMascota();
      pintarAmenazas();
      iniciarDaño();
      sfx.alarma();
      decir(`¡Cuidado! Apareció un riesgo: <b>${e.nombre}</b>. Pierdo ${e.dañoPorSegundo} de salud cada segundo y me pongo triste. Tócalo para solucionarlo: cuesta ${e.costoSolucion} cápsulas.`);
    }

    function estacionRecarga() {
      animo();
      mostrarModal({
        titulo: "La mascota necesita ir a la estación de recarga",
        quien: mascotaElegida,
        avatar: `<span class="av">${petMarkup(mascotaElegida, { mood: "bajo" })}</span>`,
        html: `Me quedé sin energía porque los riesgos eléctricos del cuarto no se solucionaron a tiempo. Recuerda: cuanto antes avises a un adulto, más seguros estamos todos.`,
        botones: [{ texto: "Reiniciar", accion: () => {
          saludMascota = 100;
          amenazasActivas = [];
          guardarEstadoMascota();
          go(pantallaMascota);
        } }]
      });
    }

    // Solución: tocar una amenaza la resuelve si hay cápsulas suficientes.
    zona.addEventListener("click", ev => {
      const boton = ev.target.closest("[data-ev]");
      if (!boton || saludMascota <= 0) return;
      const eventoActual = EVENTOS[boton.dataset.ev];
      if (recursosEnergia >= eventoActual.costoSolucion) {
        recursosEnergia -= eventoActual.costoSolucion;
        amenazasActivas = amenazasActivas.filter(id => id !== eventoActual.idEvento);
        guardarEstadoMascota();
        pintarHUD();
        flotar("−" + eventoActual.costoSolucion, contadorRecursos, "menos");
        ganarCargas(CARGAS_POR_PROBLEMA);
        pintarAmenazas();
        if (!amenazasActivas.length) detenerDaño();
        sfx.good();
        decir(`<b>¡Solucionado!</b> ${eventoActual.textoAyuda} ${cargasTxt(CARGAS_POR_PROBLEMA)}`);
      } else {
        sfx.bad();
        mostrarModal({
          titulo: "¡No tienes suficiente energía!",
          quien: mascotaElegida,
          avatar: `<span class="av">${petMarkup(mascotaElegida)}</span>`,
          html: `Solucionar «${eventoActual.nombre}» cuesta ${eventoActual.costoSolucion} cápsulas y tienes ${recursosEnergia}. Ve a los niveles a conseguir más.<br><br><b>Mientras tanto, recuerda:</b> ${eventoActual.textoAyuda}`,
          botones: [{ texto: "Ir a los niveles", accion: () => go(niveles) }, { texto: "Seguir aquí", alt: true }]
        });
      }
    });

    $("#recargar").onclick = () => {
      if (saludMascota <= 0) return;
      if (saludMascota >= 100) { decir("¡Ya tengo toda mi salud!"); return; }
      if (recursosEnergia < COSTO_RECARGA) {
        sfx.bad();
        mostrarModal({ titulo: "¡No tienes suficiente energía!", quien: mascotaElegida, avatar: `<span class="av">${petMarkup(mascotaElegida)}</span>`, html: `Recargarme cuesta ${COSTO_RECARGA} cápsulas y tienes ${recursosEnergia}. Ve a los niveles a conseguir más.`, botones: [{ texto: "Ir a los niveles", accion: () => go(niveles) }, { texto: "Seguir aquí", alt: true }] });
        return;
      }
      recursosEnergia -= COSTO_RECARGA;
      saludMascota = Math.min(100, saludMascota + SALUD_RECARGA);
      guardarEstadoMascota();
      pintarHUD();
      flotar("−" + COSTO_RECARGA, contadorRecursos, "menos");
      animo();
      sfx.good();
      decir("¡Gracias! Ya me siento con más fuerza.");
    };
    $("#mimar").onclick = () => go(tienda, "mimos");
    $("#btn-ir-niveles").onclick = () => go(niveles);

    // Generador de amenazas: cuenta segundos y lanza una amenaza al azar.
    let proxima = azar(INTERVALO_MIN, INTERVALO_MAX);
    repetir(() => {
      if (saludMascota <= 0) return;
      proxima--;
      if (proxima <= 0) { aparecerAmenaza(); proxima = azar(INTERVALO_MIN, INTERVALO_MAX); }
    }, 1000);

    pintarMascota();
    pintarAmenazas();
    decir(mensajeBase());
    if (saludMascota <= 0) estacionRecarga();
    else iniciarDaño();
  }
  pantallaMascota.tab = "cuarto";

  // ---------- Tienda ----------
  function tienda(pestaña = "ropa") {
    const nombre = SABIOS[mascotaElegida].name;
    let tab = pestaña;
    let mensaje = "";
    function cardHTML(item) {
      const tiene = tab !== "mimos" && inventario[tab].includes(item.id);
      let pv, accion, sello = "";
      if (tab === "ropa") {
        pv = petMarkup(mascotaElegida, { mood: "alto", ropa: { [item.slot]: item.id } });
        const puesto = equipado[item.slot] === item.id;
        if (puesto) sello = `<span class="sello">Puesto</span>`;
        accion = tiene ? `<button class="btn${puesto ? " alt" : ""}" data-act="vestir" data-id="${item.id}" type="button">${puesto ? "Quitar" : "Ponerse"}</button>` : "";
      } else if (tab === "cuarto") {
        pv = `<svg aria-hidden="true"><use href="#d-${item.id}" width="100%" height="100%"/></svg>`;
        const puesto = decoracion.includes(item.id);
        if (puesto) sello = `<span class="sello">En el cuarto</span>`;
        accion = tiene ? `<button class="btn${puesto ? " alt" : ""}" data-act="decorar" data-id="${item.id}" type="button">${puesto ? "Guardar" : "Poner"}</button>` : "";
      } else {
        pv = `<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#m-${item.id}"/></svg>`;
        accion = `<button class="btn" data-act="usar" data-id="${item.id}" type="button">Usar · ${item.precio}</button>`;
      }
      if (!accion) accion = `<button class="btn" data-act="comprar" data-id="${item.id}" type="button" ${cargasEnergia < item.precio ? 'aria-describedby="falta"' : ""}>Comprar · ${item.precio}</button>`;
      const extra = tab === "mimos" ? `+${item.felicidad} de felicidad` : (item.descripcion || "");
      return `<article class="panel item">
        ${sello}
        <div class="pv">${pv}</div>
        <h3>${item.nombre}</h3>
        ${extra ? `<p class="desc">${extra}</p>` : ""}
        <span class="precio"><svg aria-hidden="true"><use href="#s-carga"/></svg>${tiene ? "Ya es tuyo" : item.precio + (item.precio === 1 ? " carga" : " cargas")}</span>
        ${accion}
      </article>`;
    }
    function render() {
      const items = DATOS.tienda[tab];
      screen.innerHTML = `
        <section class="stack">
          <div><p class="eyebrow">Tienda</p><h2>Tienda de ${nombre}</h2></div>
          <div class="tabs" role="tablist" aria-label="Secciones de la tienda">
            ${[["ropa", "Ropa"], ["cuarto", "Cuarto"], ["mimos", "Mimos"]].map(([k, t]) => `<button role="tab" type="button" aria-selected="${k === tab}" data-tab="${k}">${t}</button>`).join("")}
          </div>
          ${tab === "ropa" ? `<div class="vitrina"><div class="pv">${petMarkup(mascotaElegida)}</div><p class="nota">Puedes usar una prenda en la cabeza, una en la cara y una en el cuello al mismo tiempo.</p></div>` : ""}
          ${tab === "cuarto" ? `<p class="nota">Lo que compres aparece en el cuarto de ${nombre}. Puedes guardarlo y volver a ponerlo cuando quieras.</p>` : ""}
          ${tab === "mimos" ? `<p class="nota">Los mimos suben la felicidad de ${nombre} y se gastan al usarlos. Felicidad ahora: <b>${Math.ceil(felicidadMascota)}</b> de 100.</p>` : ""}
          <div id="tiendaMsg" aria-live="polite">${mensaje}</div>
          <div class="items">${items.map(cardHTML).join("")}</div>
          <p class="nota" id="falta">Las cargas se ganan al pasar niveles (1 más tus estrellas) y al solucionar problemas eléctricos en el cuarto (${CARGAS_POR_PROBLEMA} por problema).</p>
        </section>`;
      $$("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; mensaje = ""; render(); });
      $$("[data-act]").forEach(b => b.onclick = () => actuar(b.dataset.act, items.find(i => i.id === b.dataset.id), b));
    }
    const avisar = html => { mensaje = sayPet(html); };
    function actuar(act, item, boton) {
      if (act === "comprar" || act === "usar") {
        if (act === "usar" && felicidadMascota >= 99) { avisar("¡Ya estoy feliz! Guarda tus cargas para después."); render(); return; }
        if (cargasEnergia < item.precio) {
          sfx.bad();
          avisar(`Te faltan ${item.precio - cargasEnergia} ${item.precio - cargasEnergia === 1 ? "carga" : "cargas"}. Gánalas pasando niveles y solucionando problemas en el cuarto.`);
          render();
          return;
        }
        cargasEnergia -= item.precio;
        flotar("−" + item.precio, contadorCargas, "menos");
        if (act === "usar") {
          felicidadMascota = Math.min(100, felicidadMascota + item.felicidad);
          sfx.win();
          avisar(`¡${item.nombre}! Me encantó. ¡Gracias por consentirme!`);
        } else {
          inventario[tab].push(item.id);
          if (tab === "ropa") equipado[item.slot] = item.id;
          if (tab === "cuarto" && !decoracion.includes(item.id)) decoracion.push(item.id);
          sfx.compra();
          avisar(tab === "ropa" ? `¡${item.nombre}! ¿Cómo me veo?` : `¡${item.nombre}! Ya está en nuestro cuarto.`);
        }
      } else if (act === "vestir") {
        equipado[item.slot] = equipado[item.slot] === item.id ? null : item.id;
        mensaje = "";
      } else if (act === "decorar") {
        decoracion = decoracion.includes(item.id) ? decoracion.filter(d => d !== item.id) : decoracion.concat(item.id);
        mensaje = "";
      }
      guardarEstadoMascota();
      pintarHUD();
      render();
    }
    render();
  }
  tienda.tab = "tienda";

  // ---------- Menú de niveles ----------
  function niveles() {
    let confirmReset = false;
    screen.innerHTML = `
      <section class="stack">
        <div class="hero">
          <div class="hero-art" aria-hidden="true">
            <svg viewBox="0 0 320 250">
              <circle cx="160" cy="130" r="118" fill="#0c1230" stroke="#ffc93c" stroke-width="3" stroke-opacity=".7"/>
              <g fill="#fff"><circle cx="90" cy="60" r="2"/><circle cx="230" cy="52" r="1.6"/><circle cx="250" cy="140" r="2"/><circle cx="70" cy="150" r="1.5"/></g>
              <use href="#s-neutron" x="38" y="56" width="118" height="130"/>
              <use href="#s-proton" x="166" y="72" width="116" height="128"/>
              <use href="#s-electron" x="104" y="112" width="110" height="121"/>
            </svg>
          </div>
          <div class="stack">
            <p class="eyebrow">Niveles · Gana cápsulas y cargas</p>
            <h1>Guardianes de la Energía</h1>
            <p class="lede">Electrón, Protón y Neutrón llegan a la villa de Emma para enseñarle a cuidarse de la electricidad. Cada partida es distinta: cambian los riesgos, las preguntas y las emergencias.</p>
            <button class="btn big full" id="start" type="button">${progress.casa != null ? "Seguir jugando" : "Empezar a jugar"}</button>
          </div>
        </div>
        <ol class="chapters">
          ${CHAPTERS.map((c, i) => {
            const open = isUnlocked(i);
            const done = progress[c.id] != null;
            const status = c.id === "pacto" ? (done ? "<b>Pacto firmado</b>" : "") : (done ? stars(progress[c.id]) : "");
            const label = !open ? "Bloqueado" : done ? "Repetir" : "Jugar";
            return `<li class="panel ch${open ? "" : " locked"}">
              <span class="ch-num" style="--c:${SABIOS[c.who].color}">${i + 1}</span>
              <div class="ch-body">
                <h3>${c.title}</h3>
                <p class="muted">${c.sub}</p>
                ${!open ? `<p class="muted"><small>Termina el capítulo ${i} para abrirlo.</small></p>` : ""}
                <div class="ch-foot">${status || "<span></span>"}<button class="btn small${done ? " alt" : ""}" data-ch="${c.id}" type="button" ${open ? "" : "disabled"}>${label}</button></div>
              </div>
            </li>`;
          }).join("")}
        </ol>
        <section class="panel lines" aria-labelledby="lines-h">
          <h2 id="lines-h">Líneas de emergencia</h2>
          <p class="muted">Ante cualquier riesgo eléctrico, la mejor defensa es la distancia. No te acerques, avisa a un adulto y pide que llamen a un profesional.</p>
          <dl>${DATOS.lineas.map(l => `<div${l.numero.length > 5 ? ' class="wide"' : ""}><dt>${l.nombre}</dt><dd>${l.numero}</dd></div>`).join("")}</dl>
        </section>
        <footer class="foot">
          <p>Contenido basado en el material de la campaña «Que no se te vayan las luces» de CIDET y Enel: el Manual de seguridad eléctrica, el mini manual Electrikidz, el cómic «Un 7 de agosto eléctrico» y el cuento «En el cuento seguro». Las distancias de seguridad siguen el RETIE.</p>
          <button class="linklike" id="reset" type="button">Empezar un juego nuevo (borra todo, incluida la mascota)</button>
        </footer>
      </section>`;
    $("#start").onclick = () => {
      const next = CHAPTERS.find((c, i) => isUnlocked(i) && progress[c.id] == null) || CHAPTERS[0];
      openChapter(next.id);
    };
    $$("[data-ch]").forEach(b => b.onclick = () => openChapter(b.dataset.ch));
    $("#reset").onclick = e => {
      if (!confirmReset) { confirmReset = true; e.target.textContent = "¿Seguro? Toca otra vez para borrar estrellas, cápsulas, cargas, compras y mascota"; return; }
      progress = {}; saveProgress();
      saludMascota = 100; recursosEnergia = 0; amenazasActivas = [];
      felicidadMascota = 100; cargasEnergia = 0; mascotaElegida = null;
      inventario = { ropa: [], cuarto: [] }; equipado = { cabeza: null, cara: null, cuello: null }; decoracion = [];
      guardarEstadoMascota();
      go(pantallaEleccion);
    };
  }
  niveles.tab = "niveles";
  function openChapter(id) {
    if (id === "casa" || id === "barrio") go(playScene, id);
    else if (id === "emergencia") go(emergency);
    else go(pacto);
  }

  // ---------- Caza-Riesgos (con riesgos al azar) ----------
  function playScene(id) {
    const S = DATOS.escenas[id];
    const items = Object.fromEntries(S.objetos.map(o => [o.id, o]));
    // Cada partida elige al azar cuáles objetos aparecen en su versión peligrosa.
    const candidatos = shuffle(S.objetos.filter(o => o.esRiesgo));
    const activos = new Set(candidatos.slice(0, azar(4, candidatos.length)).map(o => o.id));
    const total = activos.size;
    const st = { found: new Set(), misses: 0, time: S.tiempo, timeout: false, done: false, ganado: 0 };
    let tick = null;
    screen.innerHTML = `
      <section>
        <div class="hud">
          <div><p class="eyebrow">Capítulo ${S.n}</p><h2>${S.titulo}</h2></div>
          <div class="hud-stats">
            <span class="chip"><b id="found">0</b>&nbsp;de ${total}</span>
            <span class="chip" id="clock"></span>
            <button class="btn small alt" id="hint" type="button">Pista</button>
          </div>
        </div>
        <div class="scene-wrap" id="sceneWrap"></div>
        <div class="guide" id="guide" aria-live="polite">${say(S.sabioIntro, S.intro.replace("{n}", total))}</div>
      </section>`;
    const wrap = $("#sceneWrap");
    wrap.appendChild($("#tpl-" + id).content.cloneNode(true));
    const svg = wrap.querySelector("svg");
    const guide = $("#guide");
    const clock = $("#clock");

    $$("[data-spot]", svg).forEach(g => {
      const item = items[g.dataset.spot];
      if (item.esRiesgo) {
        const peligroso = activos.has(item.id);
        const sobra = g.querySelector(`[data-v="${peligroso ? "seguro" : "riesgo"}"]`);
        if (sobra) sobra.remove();
        if (!g.querySelector("*")) { g.remove(); return; }
      }
      g.classList.add("spot");
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "button");
      g.setAttribute("aria-label", item.esRiesgo && !activos.has(item.id) ? item.nombreSeguro : item.nombre);
    });

    const paint = () => {
      const t = Math.max(0, st.time);
      clock.textContent = st.timeout ? "Tiempo agotado" : `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
      clock.classList.toggle("low", t <= 15);
    };
    paint();
    tick = repetir(() => {
      st.time--; paint();
      if (st.time <= 0) { detener(tick); st.timeout = true; paint(); revealRest(); }
    }, 1000);

    function mark(g, cls) {
      // El área táctil (la primera figura transparente) marca mejor el centro del riesgo.
      const b = (g.querySelector('[fill="transparent"]') || g).getBBox();
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", b.x + b.width / 2);
      c.setAttribute("cy", b.y + b.height / 2);
      c.setAttribute("r", Math.min(70, Math.max(b.width, b.height) / 2 + 6));
      c.setAttribute("class", cls);
      c.setAttribute("pointer-events", "none");
      svg.appendChild(c);
      return c;
    }
    function shake() { wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake"); }
    const esPeligro = id => items[id].esRiesgo && activos.has(id);

    function pick(g) {
      if (st.done) return;
      const item = items[g.dataset.spot];
      if (esPeligro(item.id)) {
        if (st.found.has(item.id)) { guide.innerHTML = say(item.sabio, `<strong>${item.titulo}.</strong> ${item.mensaje}`); return; }
        st.found.add(item.id);
        g.classList.add("found");
        if (g._ring) { g._ring.remove(); g._ring = null; }
        mark(g, "ring");
        sfx.good();
        recursosEnergia += item.recompensa;
        st.ganado += item.recompensa;
        actualizarRecursos(item.recompensa);
        $("#found").textContent = st.found.size;
        guide.innerHTML = say(item.sabio, `<strong>${item.titulo}.</strong> ${item.mensaje} ${capsulasTxt(item.recompensa)}`);
        if (st.found.size === total) finish();
      } else {
        st.misses++;
        if (!st.timeout) { st.time = Math.max(0, st.time - 5); paint(); }
        sfx.bad(); shake();
        const texto = item.esRiesgo ? item.mensajeSeguro : item.mensaje;
        guide.innerHTML = say("neutron", `${texto} Sigue buscando. ${st.timeout ? "" : '<span class="pen">−5 segundos</span>'}`);
      }
    }
    svg.addEventListener("click", e => { const g = e.target.closest("[data-spot]"); if (g) pick(g); });
    svg.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-spot]")) { e.preventDefault(); pick(e.target); }
    });

    $("#hint").onclick = () => {
      if (st.done) return;
      const rest = $$("[data-spot]", svg).filter(g => esPeligro(g.dataset.spot) && !st.found.has(g.dataset.spot) && !g._ring);
      if (!rest.length) return;
      const g = rest[Math.floor(Math.random() * rest.length)];
      st.misses++;
      const c = mark(g, "hint-ring");
      setTimeout(() => c.remove(), 1800);
      guide.innerHTML = say("electron", "Mira dónde brilla el círculo. Cada pista cuenta como un error.");
    };

    function revealRest() {
      $$("[data-spot]", svg).forEach(g => {
        if (esPeligro(g.dataset.spot) && !st.found.has(g.dataset.spot)) g._ring = mark(g, "hint-ring");
      });
      guide.innerHTML = say("proton", "Se acabó el tiempo. Toca los riesgos que brillan para conocer su consejo.");
    }

    function finish() {
      detener(tick);
      st.done = true;
      let s = 3;
      if (st.misses >= 2) s--;
      if (st.misses >= 4) s--;
      if (st.timeout) s--;
      s = Math.max(1, s);
      $("#hint").disabled = true;
      sfx.win();
      guide.innerHTML += `
        <div class="panel result">
          <h3>¡Encontraste los ${total} riesgos!</h3>
          ${stars(s, 3, true)}
          <p class="muted">${st.misses === 0 ? "Sin errores. ¡Ojo de guardián!" : `Errores y pistas: ${st.misses}.`}${st.timeout ? " Se te acabó el tiempo, pero no te rendiste." : ""} Ganaste ${st.ganado} cápsulas.</p>
          <button class="btn" id="toQuiz" type="button">Responder ${DATOS.preguntasPorPartida} preguntas</button>
        </div>`;
      $("#toQuiz").onclick = () => go(quiz, { id, stars: s });
      $("#toQuiz").scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  playScene.tab = "niveles";

  // ---------- Preguntas (se eligen al azar del banco) ----------
  function quiz({ id, stars: sceneStars }) {
    const Q = shuffle(DATOS.preguntas[id]).slice(0, DATOS.preguntasPorPartida);
    const n = DATOS.escenas[id].n;
    let i = 0;
    function render() {
      const q = Q[i];
      let fallo = false;
      const opts = shuffle(q.opciones.map((o, k) => ({ ...o, k })));
      screen.innerHTML = `
        <section class="panel quiz">
          <div class="row between">
            <p class="eyebrow">Capítulo ${n} · Pregunta ${i + 1} de ${Q.length}</p>
            <span class="progress-dots" aria-hidden="true">${Q.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</span>
          </div>
          <h2>${q.pregunta}</h2>
          <p class="muted">Si aciertas al primer intento ganas cápsulas.</p>
          <div class="opts">${opts.map(o => `<button class="opt" data-k="${o.k}" type="button">${o.texto}</button>`).join("")}</div>
          <div class="fb" id="fb" aria-live="polite"></div>
        </section>`;
      $$(".opt").forEach(b => b.onclick = () => {
        const o = q.opciones[b.dataset.k];
        const fb = $("#fb");
        if (o.correcta) {
          sfx.good();
          b.classList.add("ok");
          $$(".opt").forEach(x => x.disabled = true);
          let premio = "";
          if (!fallo && o.recompensa) {
            recursosEnergia += o.recompensa;
            actualizarRecursos(o.recompensa);
            premio = " " + capsulasTxt(o.recompensa);
          }
          fb.innerHTML = say(q.sabio, o.explicacion + premio) + `<button class="btn" id="next" type="button">${i < Q.length - 1 ? "Siguiente pregunta" : "Terminar capítulo"}</button>`;
          $("#next").onclick = () => { i++; if (i < Q.length) { render(); window.scrollTo(0, 0); } else go(chapterDone, { id, stars: sceneStars }); };
          $("#next").focus();
        } else {
          fallo = true;
          sfx.bad();
          b.classList.add("no");
          b.disabled = true;
          fb.innerHTML = say(q.sabio, o.explicacion + " Intenta otra vez.");
        }
      });
    }
    render();
  }
  quiz.tab = "niveles";

  // ---------- Capítulo terminado ----------
  function chapterDone({ id, stars: s }) {
    progress[id] = Math.max(progress[id] || 0, s);
    saveProgress();
    const cargas = 1 + s;
    const idx = CHAPTERS.findIndex(c => c.id === id);
    const next = CHAPTERS[idx + 1];
    const c = CHAPTERS[idx];
    screen.innerHTML = `
      <section class="panel quiz">
        <p class="eyebrow">Capítulo ${idx + 1} completado</p>
        <h2>${c.title}</h2>
        ${stars(s, 3, true)}
        ${sayPet(`${s === 3 ? "¡Tres estrellas! Eres un gran guardián de la energía." : "¡Muy bien! Repite el capítulo cuando quieras: los riesgos cambian cada vez."} Ganaste ${cargasTxt(cargas)} para la tienda.`)}
        <div class="stack">
          <button class="btn full" id="room" type="button">Volver al cuarto</button>
          ${next ? `<button class="btn alt full" id="next" type="button">Ir al capítulo ${idx + 2}</button>` : ""}
          <button class="btn alt full" id="map" type="button">Ver los niveles</button>
        </div>
      </section>`;
    ganarCargas(cargas);
    $("#room").onclick = () => go(pantallaMascota);
    if (next) $("#next").onclick = () => openChapter(next.id);
    $("#map").onclick = () => go(niveles);
  }
  chapterDone.tab = "niveles";

  // ---------- Emergencia (escenario, distractores y llamadas al azar) ----------
  function emergency() {
    const STEPS = DATOS.pasosEmergencia.concat(shuffle(DATOS.accionesPeligrosas).slice(0, 2));
    const escenario = DATOS.escenariosEmergencia[Math.floor(Math.random() * DATOS.escenariosEmergencia.length)];
    let next = 1, mistakes = 0;
    const order = shuffle(STEPS);
    screen.innerHTML = `
      <section class="stack">
        <div class="hud"><div><p class="eyebrow">Capítulo 3</p><h2>¡Emergencia!</h2></div><span class="chip" id="phase">Parte 1 de 2</span></div>
        <div class="panel stack">
          <p>${escenario} Toca los pasos en el orden correcto. Cuidado: hay dos acciones peligrosas mezcladas.</p>
          <div><h3 style="margin-bottom:8px">Tu plan</h3><ol class="plan" id="plan">${[1, 2, 3, 4, 5].map(() => "<li>…</li>").join("")}</ol></div>
          <div><h3 style="margin-bottom:8px">Acciones</h3><div class="steps" id="steps">${order.map(s => `<button class="opt" data-k="${STEPS.indexOf(s)}" type="button">${s.texto}</button>`).join("")}</div></div>
        </div>
        <div class="guide" id="guide" aria-live="polite">${say("neutron", "Respira. Primero piensa en tu seguridad: nunca te acerques a alguien que sigue en contacto con la electricidad.")}</div>
      </section>`;
    const guide = $("#guide");
    $$("#steps .opt").forEach(b => b.onclick = () => {
      const s = STEPS[b.dataset.k];
      if (s.orden === next) {
        sfx.good();
        recursosEnergia += s.recompensa;
        actualizarRecursos(s.recompensa);
        const li = $$("#plan li")[next - 1];
        li.textContent = s.texto; li.classList.add("done");
        b.remove();
        next++;
        guide.innerHTML = say("electron", (next <= 5 ? "¡Correcto! ¿Cuál sigue?" : "¡Plan completo! Ahora practica las llamadas.") + " " + capsulasTxt(s.recompensa));
        if (next > 5) setTimeout(() => dialer(callMistakes => terminar(callMistakes)), 900);
      } else {
        mistakes++;
        sfx.bad();
        b.classList.add("no");
        setTimeout(() => b.classList.remove("no"), 700);
        guide.innerHTML = say(s.peligro ? "proton" : "neutron", s.peligro ? s.peligro : `Ese paso va después. ${DATOS.pistasPasos[next]}`);
      }
    });

    function terminar(callMistakes) {
      const all = mistakes + callMistakes;
      let s = 3;
      if (all >= 2) s--;
      if (all >= 4) s--;
      sfx.win();
      go(chapterDone, { id: "emergencia", stars: Math.max(1, s) });
    }

    function dialer(done) {
      const CALLS = shuffle(DATOS.llamadas).slice(0, DATOS.llamadasPorPartida);
      let round = 0, wrong = 0, total = 0, value = "";
      $("#phase").textContent = "Parte 2 de 2";
      const host = screen.querySelector(".panel");
      function render() {
        const c = CALLS[round];
        value = ""; wrong = 0;
        host.innerHTML = `
          <div class="stack">
            <div>
              <p class="eyebrow">Llamada ${round + 1} de ${CALLS.length}</p>
              <h2>${c.pregunta}</h2>
              <p class="muted">Marca el número y toca «Llamar».</p>
            </div>
            <div class="dial">
              <div class="display" id="disp" aria-live="polite">&nbsp;</div>
              <div class="keys">${["1","2","3","4","5","6","7","8","9","","0",""].map(k => k ? `<button class="key" data-key="${k}" type="button">${k}</button>` : "<span></span>").join("")}</div>
              <div class="row"><button class="btn alt" id="del" type="button">Borrar</button><button class="btn" id="call" type="button">Llamar</button></div>
            </div>
          </div>`;
        guide.innerHTML = say(c.sabio, c.pregunta);
        const disp = $("#disp");
        const show = () => disp.innerHTML = value || "&nbsp;";
        $$(".key").forEach(k => k.onclick = () => { if (value.length < 4) { value += k.dataset.key; show(); } });
        $("#del").onclick = () => { value = value.slice(0, -1); show(); };
        $("#call").onclick = () => {
          if (!value) return;
          if (value === c.numero || value === c.alterno) {
            sfx.good();
            recursosEnergia += c.recompensa;
            actualizarRecursos(c.recompensa);
            const extra = value === c.alterno ? ` El 123 también sirve porque es la línea única, pero el número directo es el <b>${c.numero}</b>.` : "";
            guide.innerHTML = say(c.sabio, `¡Llamada correcta!${extra} ${capsulasTxt(c.recompensa)}`);
            round++;
            $("#call").disabled = true;
            setTimeout(() => round < CALLS.length ? render() : done(total), 1400);
          } else {
            sfx.bad(); wrong++; total++;
            value = ""; show();
            guide.innerHTML = say(c.sabio, wrong >= 2 ? `Ese no es. El número correcto es el <b>${c.numero}</b>. Márcalo para seguir.` : "Ese número no es. Inténtalo otra vez.");
          }
        };
      }
      render();
    }
  }
  emergency.tab = "niveles";

  // ---------- Pacto ----------
  function pacto() {
    const CONSEJOS = DATOS.consejos;
    const seen = new Set();
    const heights = [62, 88, 100, 92, 74];
    screen.innerHTML = `
      <section class="stack">
        <div><p class="eyebrow">Capítulo 4</p><h2>El pacto de los cinco dedos</h2></div>
        ${say("all", "Cinco son los dedos de tu mano y cinco son los consejos para cuidarte. Toca cada dedo para recordarlos.")}
        <div class="panel stack">
          <div>
            <div class="hand">${CONSEJOS.map((c, i) => `<button class="finger" data-i="${i}" style="height:${heights[i]}%;--c:${c.color}" type="button" aria-label="Consejo ${i + 1}">${i + 1}</button>`).join("")}</div>
            <div class="palm" aria-hidden="true"></div>
          </div>
          <ol class="consejos" id="list">${CONSEJOS.map((c, i) => `<li class="off" style="--c:${c.color}"><span class="n">${i + 1}</span><span>Toca el dedo ${i + 1}.</span></li>`).join("")}</ol>
        </div>
        <div id="certHost"></div>
      </section>`;
    $$(".finger").forEach(f => f.onclick = () => {
      const i = +f.dataset.i, c = CONSEJOS[i];
      f.classList.add("on");
      const li = $$("#list li")[i];
      li.classList.remove("off");
      li.innerHTML = `<span class="n">${i + 1}</span><span><b>${SABIOS[c.sabio].name}:</b> ${c.texto}</span>`;
      if (!seen.has(i)) { seen.add(i); sfx.good(); }
      if (seen.size === 5 && !$("#cert")) certificate();
    });

    function certificate() {
      sfx.win();
      const primeraVez = progress.pacto == null;
      progress.pacto = 1; saveProgress(); pintarHUD();
      const total = ["casa", "barrio", "emergencia"].reduce((s, k) => s + (progress[k] || 0), 0);
      const date = new Date().toLocaleDateString("es-CO", { day: "numeric", month: "long", year: "numeric" });
      const saved = store.get("name", "");
      $("#certHost").innerHTML = `
        <div class="panel stack" id="cert">
          <label for="nombre">Escribe tu nombre para firmar el pacto
            <input type="text" id="nombre" maxlength="40" autocomplete="off" placeholder="Tu nombre" value="${escapeHtml(saved)}">
          </label>
          <div class="cert">
            <p class="eyebrow">Pacto de los cinco dedos</p>
            <h2>Guardián de la Energía</h2>
            <div class="name" id="certName">${saved ? escapeHtml(saved) : "&nbsp;"}</div>
            <p>Prometo cuidar la energía de mi casa y de mi barrio, recordar los cinco consejos y avisar a los demás cuando vea un riesgo eléctrico.</p>
            ${stars(total, 9)}
            <p class="muted"><small>${total} de 9 estrellas · ${date}</small></p>
            <div class="pv">${petMarkup(mascotaElegida, { mood: "alto" })}</div>
          </div>
          ${primeraVez ? sayPet(`¡Firmamos el pacto! Te ganaste ${cargasTxt(CARGAS_PACTO)}.`) : ""}
          <button class="btn full" id="again" type="button">Volver al cuarto</button>
        </div>`;
      if (primeraVez) ganarCargas(CARGAS_PACTO);
      $("#nombre").oninput = e => { const v = e.target.value.trim(); $("#certName").innerHTML = v ? escapeHtml(v) : "&nbsp;"; store.set("name", v); };
      $("#again").onclick = () => go(pantallaMascota);
      $("#cert").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  pacto.tab = "niveles";

  go(mascotaElegida ? pantallaMascota : pantallaEleccion);
})();
</script>

</html>
